# PROPOSITION de workflow CI (à activer : copier ce fichier par-dessus
# `.github/workflows/ci.yml`). Vérifie le backend (Maven, profil H2), le scraper
# (pytest) et le frontend (`npm ci && npm run build`) à chaque push et sur les PR
# vers main. Aucun service externe requis.
#
# Le job `frontend` est la nouveauté de la mini-feature 10A : `npm run build`
# exécute `vue-tsc` sur `src/**` et `devtools/**`, ce qui aurait attrapé les
# erreurs de types restées sur `main` (voir la PR 10A).
name: CI

on:
  push:
    branches: [main, "arena/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (mvn clean test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build et tests (H2)
        run: cd backend && mvn -B clean test

  frontend:
    name: Frontend (npm run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Types (vue-tsc) puis build de production
        run: npm run build
        working-directory: frontend

  scraper:
    name: Scraper (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installation et tests
        run: |
          cd scraper
          pip install -r requirements.txt
          pip install -e .
          python -m pytest -q
